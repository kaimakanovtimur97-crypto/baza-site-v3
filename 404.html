<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0D29B2">
  <title>Страница не найдена | БАЗА</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20260831-static">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
    .error-card{width:min(720px,100%);padding:clamp(32px,7vw,72px);border-radius:32px;background:#fff;text-align:center;box-shadow:0 24px 80px rgba(13,41,178,.1)}
    .error-code{font-size:clamp(72px,18vw,160px);line-height:.8;color:var(--accent);letter-spacing:-.08em}
    .error-card h1{margin-top:32px;font-size:clamp(32px,6vw,56px);line-height:1}
    .error-card p{max-width:520px;margin:20px auto 0;color:var(--text-2)}
    .error-card .btn{margin-top:32px}
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-card">
      <div class="error-code" aria-hidden="true">404</div>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе есть ошибка. Вернитесь на главную страницу БАЗА.</p>
      <a class="btn btn--primary" href="index.html">На главную</a>
    </section>
  </main>
</body>
</html>
